spring.application.name=freshmeal

#server port
server.port=8030

# Mongo DB configurations
spring.data.mongodb.uri = mongodb://localhost:27017/meal

#AWS S3 configuration from environment variables 
aws.access.key = ${ACCESS_KEY}
aws.secret.key = ${SECRET_KEY}
aws.region = ap-south-1
aws.s3.bucket.name = fresh-meal
# =====================================================
# MONGO QUERY LOGGING
# =====================================================

logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

logging.level.org.mongodb.driver.protocol.command=TRACE


# =====================================================
# APPLICATION LOGGING
# =====================================================

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Individual file size
spring.servlet.multipart.max-file-size=5MB

# Total request size
spring.servlet.multipart.max-request-size=5MB

# ===============================
# LOGGING \u2192 Console + File
# ===============================
logging.file.name=logs/freshmeal.log

# Spring transaction lifecycle
logging.level.org.springframework.transaction=TRACE
logging.level.org.springframework.orm.jpa=DEBUG

logging.level.org.springframework.data.mongodb.core.convert=TRACE
logging.level.org.springframework.data.mongodb=DEBUG

# Hibernate SQL & parameters
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.transaction=TRACE
logging.level.org.hibernate.engine.transaction=TRACE
spring.jpa.properties.hibernate.statement_inspector=com.scm.security.filters.UnifiedQueryCapture

# ===============================
# JPA / HIBERNATE SQL FORMATTING
# ===============================
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ===============================
# LOG FILE ROTATION
# ===============================
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=10
