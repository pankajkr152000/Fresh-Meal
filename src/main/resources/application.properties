# =====================================================
# APPLICATION
# =====================================================
spring.application.name=freshmeal

# =====================================================
# SERVER
# =====================================================
server.port=8030
server.servlet.context-path=/

# =====================================================
# MONGODB
# =====================================================
spring.mongodb.uri=mongodb://localhost:27017/meal
spring.mongodb.database=meal

# =====================================================
# AWS S3
# =====================================================
aws.access.key=${ACCESS_KEY}
aws.secret.key=${SECRET_KEY}
aws.region=ap-south-1
aws.s3.bucket.name=fresh-meal

# =====================================================
# FILE UPLOAD
# =====================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# =====================================================
# LOGGING
# =====================================================
logging.file.name=logs/freshmeal.log

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# =====================================================
# LOG ROTATION
# =====================================================
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB

# =====================================================
# APPLICATION LOG LEVELS
# =====================================================
logging.level.root=INFO

logging.level.com.foodies.freshmeal=INFO

# =====================================================
# AUDIT LOGGING
# =====================================================
logging.level.com.foodies.freshmeal.common.audit=INFO

# =====================================================
# MONGODB LOGGING
# =====================================================
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# Enable only while debugging queries
# logging.level.org.mongodb.driver.protocol.command=TRACE

# Enable only while debugging entity mapping
# logging.level.org.springframework.data.mongodb.core.convert=TRACE

# logging.level.org.springframework.data.mongodb=DEBUG

# =====================================================
# ACTUATOR (Future Use)
# =====================================================
management.endpoints.web.exposure.include=health,info,metrics

management.endpoint.health.show-details=always

# =====================================================
# JACKSON
# =====================================================
spring.jackson.default-property-inclusion=non_null

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata

app.date.format=yyyy-MM-dd HH:mm:ss

# =====================================================
# ERROR HANDLING
# =====================================================
server.error.include-message=always

server.error.include-binding-errors=always

server.error.include-stacktrace=never

# =====================================================
# CUSTOM EXPORT DIRECTORY (Future AWS/Linux Support)
# =====================================================
app.export.directory=exports

# =====================================================
# IMAGE STORAGE (Future Use)
# =====================================================
app.image.max-size-mb=5